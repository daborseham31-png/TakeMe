<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>School Return Ride</title>
    <!-- No external resources anywhere on this page (fonts, scripts, styles,
         images) — matches this page's own Content-Security-Policy
         (default-src/script-src/style-src 'self' only). System font stack
         only, see style.css. -->
    <link rel="stylesheet" href="/school-kiosk/style.css" />
  </head>
  <body>
    <!-- Shown instead of everything else when the kiosk has no valid
         ?schoolId= configured — see app.js's readSchoolId(). Never sends a
         lookup request in this state. -->
    <main id="configErrorScreen" class="screen" hidden>
      <div class="card card--center">
        <p class="icon icon--warning" aria-hidden="true">&#9888;</p>
        <h1 data-i18n="configErrorTitle"></h1>
        <p data-i18n="configErrorMessage"></p>
      </div>
    </main>

    <div id="app" class="app">
      <header class="topbar">
        <div class="lang-menu" id="langMenu">
          <button
            type="button"
            id="langMenuBtn"
            class="lang-menu__toggle"
            aria-haspopup="true"
            aria-expanded="false"
            aria-controls="langMenuDropdown"
            data-i18n-aria-label="languageSwitchLabel"
          >
            <!-- An inline stroke icon, not the &#127760; globe emoji it replaces —
                 emoji glyphs render from the platform's own color font and ignore
                 CSS `color`, so there is no reliable way to make that emoji exactly
                 #F58220 across devices. This path/stroke uses `currentColor`, so
                 its color is fully controlled by .lang-menu__toggle's CSS `color`
                 below (which is the same var(--color-primary) already used
                 everywhere else in the kiosk). -->
            <svg
              class="lang-menu__icon"
              viewBox="0 0 24 24"
              width="22"
              height="22"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <circle cx="12" cy="12" r="9"></circle>
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <path d="M12 3c2.5 2.7 4 6 4 9s-1.5 6.3-4 9c-2.5-2.7-4-6-4-9s1.5-6.3 4-9z"></path>
            </svg>
          </button>

          <div
            class="lang-menu__dropdown"
            id="langMenuDropdown"
            role="menu"
            aria-labelledby="langMenuBtn"
            hidden
          >
            <button type="button" class="lang-menu__option" role="menuitemradio" data-lang="ar">
              <span class="lang-menu__option-label">العربية</span>
              <span class="lang-menu__option-check" aria-hidden="true">&#10003;</span>
            </button>
            <button type="button" class="lang-menu__option" role="menuitemradio" data-lang="he">
              <span class="lang-menu__option-label">עברית</span>
              <span class="lang-menu__option-check" aria-hidden="true">&#10003;</span>
            </button>
            <button type="button" class="lang-menu__option" role="menuitemradio" data-lang="en">
              <span class="lang-menu__option-label">English</span>
              <span class="lang-menu__option-check" aria-hidden="true">&#10003;</span>
            </button>
            <button type="button" class="lang-menu__option" role="menuitemradio" data-lang="ru">
              <span class="lang-menu__option-label">Русский</span>
              <span class="lang-menu__option-check" aria-hidden="true">&#10003;</span>
            </button>
          </div>
        </div>

        <h1 class="topbar__title" data-i18n="appTitle"></h1>
      </header>

      <!-- ================= ENTRY SCREEN ================= -->
      <section id="entryScreen" class="screen">
        <div class="card">
          <p class="instruction" data-i18n="enterCodeInstruction"></p>

          <div
            class="digit-boxes"
            id="digitBoxes"
            role="group"
            data-i18n-aria-label="digitBoxesLabel"
          >
            <span class="digit-box" data-index="0" aria-hidden="true"></span>
            <span class="digit-box" data-index="1" aria-hidden="true"></span>
            <span class="digit-box" data-index="2" aria-hidden="true"></span>
            <span class="digit-box" data-index="3" aria-hidden="true"></span>
            <span class="digit-box" data-index="4" aria-hidden="true"></span>
            <span class="digit-box" data-index="5" aria-hidden="true"></span>
          </div>

          <p id="codeProgressAnnouncer" class="sr-only" aria-live="polite"></p>

          <div class="keypad" id="keypad">
            <button type="button" class="keypad__key" data-digit="1">1</button>
            <button type="button" class="keypad__key" data-digit="2">2</button>
            <button type="button" class="keypad__key" data-digit="3">3</button>
            <button type="button" class="keypad__key" data-digit="4">4</button>
            <button type="button" class="keypad__key" data-digit="5">5</button>
            <button type="button" class="keypad__key" data-digit="6">6</button>
            <button type="button" class="keypad__key" data-digit="7">7</button>
            <button type="button" class="keypad__key" data-digit="8">8</button>
            <button type="button" class="keypad__key" data-digit="9">9</button>
            <button type="button" class="keypad__key keypad__key--action" id="clearBtn" data-i18n="clearButton"></button>
            <button type="button" class="keypad__key" data-digit="0">0</button>
            <button type="button" class="keypad__key keypad__key--action" id="backspaceBtn" data-i18n-aria-label="backspaceButtonLabel">&#9003;</button>
          </div>

          <button type="button" id="submitBtn" class="primary-btn" disabled data-i18n="checkRideButton"></button>
        </div>
      </section>

      <!-- ================= LOADING SCREEN ================= -->
      <section id="loadingScreen" class="screen" hidden>
        <div class="card card--center">
          <div class="spinner" aria-hidden="true"></div>
          <p data-i18n="loadingMessage"></p>
        </div>
      </section>

      <!-- ================= RESULT SCREEN ================= -->
      <section id="resultScreen" class="screen" hidden aria-live="polite">
        <div class="card" id="resultCard">
          <!-- Populated entirely from JS via safe DOM creation (textContent
               only) — see app.js's renderResult(). Never innerHTML with any
               backend-returned value. -->
        </div>

        <p class="countdown" id="countdownText" aria-live="polite"></p>

        <div class="result-actions">
          <button type="button" id="refreshBtn" class="secondary-btn" hidden data-i18n="refreshStatusButton"></button>
          <button type="button" id="returnToStartBtn" class="primary-btn" data-i18n="returnToStartButton"></button>
        </div>
      </section>
    </div>

    <script src="/school-kiosk/app.js" defer></script>
  </body>
</html>
