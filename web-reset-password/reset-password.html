<!doctype html>
<html lang="en" dir="ltr" id="html-root">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Reset your TakeMe password</title>
<style>
  :root {
    --brand: #F58220;
    --brand-dark: #D8541F;
    --bg: #FBF7F1;
    --text: #111827;
    --muted: #7C5F46;
    --border: #E7DCD1;
    --input-bg: #FFFDFC;
    --error: #B91C1C;
    --success: #166534;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--text);
    padding: 20px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: #FFFFFF;
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 24px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    text-align: center;
    margin: 0 0 8px;
  }
  p.subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 15px;
    margin: 0 0 20px;
  }
  label {
    display: block;
    font-weight: 800;
    font-size: 14px;
    margin: 16px 0 8px;
  }
  input[type="password"] {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 13px 14px;
    background: var(--input-bg);
    color: var(--text);
    font-size: 15px;
  }
  input[type="password"]:focus {
    outline: 2px solid var(--brand);
  }
  button.primary {
    width: 100%;
    background: var(--brand);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 15px;
    font-size: 16px;
    font-weight: 900;
    margin-top: 20px;
    cursor: pointer;
  }
  button.primary:disabled {
    opacity: 0.6;
    cursor: default;
  }
  a.button-link {
    display: block;
    text-align: center;
    text-decoration: none;
    width: 100%;
    background: var(--brand);
    color: #fff !important;
    border-radius: 12px;
    padding: 15px;
    font-size: 16px;
    font-weight: 900;
    margin-top: 20px;
  }
  .center {
    text-align: center;
  }
  .error-text {
    color: var(--error);
    font-weight: 700;
    font-size: 13.5px;
    margin-top: 10px;
  }
  .status-text {
    color: var(--muted);
    font-size: 15px;
    text-align: center;
    margin: 6px 0 4px;
  }
  .icon {
    font-size: 40px;
    text-align: center;
    margin-bottom: 6px;
  }
  .spinner {
    width: 30px;
    height: 30px;
    margin: 0 auto 14px;
    border: 3px solid var(--border);
    border-top-color: var(--brand);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  [dir="rtl"] .card { text-align: right; }
  .hidden { display: none; }
</style>
</head>
<body>
  <div class="card">
    <div id="view-verifying">
      <div class="spinner"></div>
      <p class="status-text" data-i18n="verifying">Verifying your reset link...</p>
    </div>

    <div id="view-invalid" class="hidden">
      <div class="icon">✕</div>
      <h1 data-i18n="invalidLinkTitle">Link expired or invalid</h1>
      <p class="status-text" data-i18n="invalidLinkMessage">This password reset link is no longer valid. Please request a new one from the TakeMe app.</p>
    </div>

    <div id="view-form" class="hidden">
      <h1 data-i18n="title">Set a new password</h1>

      <label for="input-password" data-i18n="newPassword">New password</label>
      <input id="input-password" type="password" autocomplete="new-password" />

      <label for="input-confirm" data-i18n="confirmPassword">Confirm password</label>
      <input id="input-confirm" type="password" autocomplete="new-password" />

      <p id="form-error" class="error-text hidden"></p>

      <button id="submit-button" class="primary" type="button" data-i18n="resetButton">Reset Password</button>
    </div>

    <div id="view-success" class="hidden">
      <div class="icon">✓</div>
      <h1 data-i18n="successTitle">Password updated</h1>
      <p class="status-text" data-i18n="successMessage">Your password has been changed successfully. You can now sign in with your new password.</p>
      <a class="button-link" href="takeme://" data-i18n="openApp">Open TakeMe app</a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    import {
      getAuth,
      verifyPasswordResetCode,
      confirmPasswordReset,
    } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

    // Same public (non-secret) config already shipped inside the TakeMe app
    // bundle — see firebase.ts. Safe to embed in a client-side page.
    const firebaseConfig = {
      apiKey: "AIzaSyCbOSLRMCO_d8X2jOO3o5DP4QPZ5fvVe2I",
      authDomain: "take-me-cc3de.firebaseapp.com",
      projectId: "take-me-cc3de",
      storageBucket: "take-me-cc3de.firebasestorage.app",
      messagingSenderId: "68698161381",
      appId: "1:68698161381:web:4ffe5172999d8698f7140c",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const STRINGS = {
      en: {
        verifying: "Verifying your reset link...",
        invalidLinkTitle: "Link expired or invalid",
        invalidLinkMessage: "This password reset link is no longer valid. Please request a new one from the TakeMe app.",
        title: "Set a new password",
        newPassword: "New password",
        confirmPassword: "Confirm password",
        passwordsDontMatch: "Passwords do not match.",
        passwordTooShort: "Password must be at least 6 characters.",
        resetButton: "Reset Password",
        resetting: "Resetting...",
        successTitle: "Password updated",
        successMessage: "Your password has been changed successfully. You can now sign in with your new password.",
        openApp: "Open TakeMe app",
        resettingError: "Could not reset your password. Please request a new link and try again.",
      },
      ar: {
        verifying: "جارٍ التحقق من رابط إعادة التعيين...",
        invalidLinkTitle: "الرابط منتهي الصلاحية أو غير صالح",
        invalidLinkMessage: "رابط إعادة تعيين كلمة المرور هذا لم يعد صالحًا. يرجى طلب رابط جديد من تطبيق TakeMe.",
        title: "تعيين كلمة مرور جديدة",
        newPassword: "كلمة المرور الجديدة",
        confirmPassword: "تأكيد كلمة المرور",
        passwordsDontMatch: "كلمتا المرور غير متطابقتين.",
        passwordTooShort: "يجب أن تتكون كلمة المرور من 6 أحرف على الأقل.",
        resetButton: "إعادة تعيين كلمة المرور",
        resetting: "جارٍ إعادة التعيين...",
        successTitle: "تم تحديث كلمة المرور",
        successMessage: "تم تغيير كلمة مرورك بنجاح. يمكنك الآن تسجيل الدخول بكلمة المرور الجديدة.",
        openApp: "فتح تطبيق TakeMe",
        resettingError: "تعذّر إعادة تعيين كلمة المرور. يرجى طلب رابط جديد والمحاولة مجددًا.",
      },
      he: {
        verifying: "מאמת את קישור האיפוס...",
        invalidLinkTitle: "הקישור פג תוקף או אינו תקין",
        invalidLinkMessage: "קישור איפוס הסיסמה הזה כבר אינו תקף. יש לבקש קישור חדש מאפליקציית TakeMe.",
        title: "הגדרת סיסמה חדשה",
        newPassword: "סיסמה חדשה",
        confirmPassword: "אימות סיסמה",
        passwordsDontMatch: "הסיסמאות אינן תואמות.",
        passwordTooShort: "הסיסמה חייבת להכיל לפחות 6 תווים.",
        resetButton: "איפוס סיסמה",
        resetting: "מאפס...",
        successTitle: "הסיסמה עודכנה",
        successMessage: "הסיסמה שלך שונתה בהצלחה. כעת תוכל להתחבר עם הסיסמה החדשה.",
        openApp: "פתח את אפליקציית TakeMe",
        resettingError: "לא ניתן היה לאפס את הסיסמה. יש לבקש קישור חדש ולנסות שוב.",
      },
    };

    const RTL_LANGS = ["ar", "he"];

    const params = new URLSearchParams(window.location.search);
    const oobCode = params.get("oobCode") || "";
    const langParam = params.get("lang") || "";
    const lang = STRINGS[langParam] ? langParam : "en";
    const t = (key) => STRINGS[lang][key] || STRINGS.en[key] || key;

    document.documentElement.lang = lang;
    document.documentElement.dir = RTL_LANGS.includes(lang) ? "rtl" : "ltr";

    document.querySelectorAll("[data-i18n]").forEach((node) => {
      const key = node.getAttribute("data-i18n");
      node.textContent = t(key);
    });

    const viewVerifying = document.getElementById("view-verifying");
    const viewInvalid = document.getElementById("view-invalid");
    const viewForm = document.getElementById("view-form");
    const viewSuccess = document.getElementById("view-success");
    const formError = document.getElementById("form-error");
    const submitButton = document.getElementById("submit-button");
    const passwordInput = document.getElementById("input-password");
    const confirmInput = document.getElementById("input-confirm");

    const showView = (view) => {
      [viewVerifying, viewInvalid, viewForm, viewSuccess].forEach((el) => {
        el.classList.toggle("hidden", el !== view);
      });
    };

    const showFormError = (message) => {
      formError.textContent = message;
      formError.classList.remove("hidden");
    };

    const clearFormError = () => {
      formError.textContent = "";
      formError.classList.add("hidden");
    };

    const translateResetErrorCode = (code) => {
      switch (code) {
        case "auth/weak-password":
          return t("passwordTooShort");
        case "auth/expired-action-code":
        case "auth/invalid-action-code":
        case "auth/user-disabled":
        case "auth/user-not-found":
          return t("invalidLinkMessage");
        default:
          return t("resettingError");
      }
    };

    async function init() {
      if (!oobCode) {
        showView(viewInvalid);
        return;
      }

      try {
        // Verifies the code with Firebase itself — never decoded/constructed
        // locally.
        await verifyPasswordResetCode(auth, oobCode);
        showView(viewForm);
      } catch (error) {
        showView(viewInvalid);
      }
    }

    submitButton.addEventListener("click", async () => {
      clearFormError();

      const newPassword = passwordInput.value;
      const confirmPassword = confirmInput.value;

      if (newPassword.length < 6) {
        showFormError(t("passwordTooShort"));
        return;
      }

      if (newPassword !== confirmPassword) {
        showFormError(t("passwordsDontMatch"));
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = t("resetting");

      try {
        // The ONLY thing that actually changes the password — reaching this
        // page (or a successful verify above) is never treated as success on
        // its own.
        await confirmPasswordReset(auth, oobCode, newPassword);
        showView(viewSuccess);
      } catch (error) {
        const code = error && error.code;

        if (code === "auth/expired-action-code" || code === "auth/invalid-action-code") {
          showView(viewInvalid);
        } else {
          showFormError(translateResetErrorCode(code));
          submitButton.disabled = false;
          submitButton.textContent = t("resetButton");
        }
      }
    });

    init();
  </script>
</body>
</html>
